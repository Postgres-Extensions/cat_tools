name: CI
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.asc'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.asc'
env:
  PGUSER: postgres
jobs:
  test:
    strategy:
      matrix:
        pg: [18, 17, 16, 15, 14, 13, 12]
    name: 🐘 PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Install rsync and server headers
        # postgresql-server-dev-NN provides catalog/pg_class.h, which
        # test/gen-relkinds.sh reads for the relkind drift check in
        # test/sql/relation__.sql.
        run: apt-get install -y rsync postgresql-server-dev-${{ matrix.pg }}
      - name: Test on PostgreSQL ${{ matrix.pg }}
        run: |
          # Fail if the relkind drift source is empty (headers missing): the
          # drift check must actually run on every version, not pass silently.
          make check-relkind-source
          make test
          # `make test` never exits non-zero on regressions (pgxntool marks
          # installcheck `.IGNORE`), so gate the build explicitly on the
          # pgtap/regression.diffs check or failures would pass silently.
          make verify-results

  pg-upgrade-test:
    strategy:
      matrix:
        include:
          - old_pg: "12"
            new_pg: "13"
          - old_pg: "12"
            new_pg: "18"
    name: 🔄 Binary pg_upgrade ${{ matrix.old_pg }} → ${{ matrix.new_pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    env:
      # Both clusters must use the same initdb options so pg_upgrade sees
      # consistent settings (checksums, auth) on old and new clusters.
      INITDB_OPTS: --data-checksums --auth trust
    steps:
      - name: Start PostgreSQL ${{ matrix.old_pg }}
        run: pg-start ${{ matrix.old_pg }}
      - name: Recreate old cluster with data checksums enabled
        run: |
          pg_ctlcluster ${{ matrix.old_pg }} test stop
          pg_dropcluster ${{ matrix.old_pg }} test
          # -p 5432: pg_createcluster assigns the next available port, which
          # may not be 5432 after pg-start has claimed and released it. Force
          # 5432 so subsequent psql/createdb calls connect without -p.
          pg_createcluster -p 5432 ${{ matrix.old_pg }} test -- $INITDB_OPTS
          pg_ctlcluster ${{ matrix.old_pg }} test start
          pg_isready -t 30
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Install rsync
        run: apt-get install -y rsync
      - name: Install cat_tools into old cluster
        run: make install
      - name: Install cat_tools 0.2.2 into the pg_upgrade test database
        # Install an OLDER version than current so the post-upgrade ALTER
        # EXTENSION UPDATE below has real work to do. 0.2.2 is the oldest version
        # that both installs on the old cluster AND survives binary pg_upgrade:
        # the pre-0.2.2 views reference catalog columns removed in newer
        # PostgreSQL, so they cannot be pg_upgraded (fixed for 0.2.2 in the
        # re-release, https://github.com/Postgres-Extensions/cat_tools/pull/18).
        run: psql -c "CREATE EXTENSION cat_tools VERSION '0.2.2'"
      - name: Install PostgreSQL ${{ matrix.new_pg }}
        run: apt-get install -y postgresql-${{ matrix.new_pg }} postgresql-server-dev-${{ matrix.new_pg }}
      - name: Install cat_tools into new cluster
        # PG_CONFIG must be specified explicitly: at this point both old and new
        # PostgreSQL are installed, and the default pg_config on PATH may not be
        # the new version's.
        run: make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.new_pg }}/bin/pg_config
      - name: Stop old cluster, binary pg_upgrade to PostgreSQL ${{ matrix.new_pg }}, start new cluster
        run: |
          pg_ctlcluster ${{ matrix.old_pg }} test stop
          pg_createcluster -p 5432 ${{ matrix.new_pg }} test -- $INITDB_OPTS
          # PG17+ writes logs to $new_datadir/pg_upgrade_output.d/; older
          # versions write to CWD. Search both on failure.
          mkdir -p /tmp/pg_upgrade_logs
          chown postgres:postgres /tmp/pg_upgrade_logs
          su -c "cd /tmp/pg_upgrade_logs && /usr/lib/postgresql/${{ matrix.new_pg }}/bin/pg_upgrade \
            -b /usr/lib/postgresql/${{ matrix.old_pg }}/bin \
            -B /usr/lib/postgresql/${{ matrix.new_pg }}/bin \
            -d /var/lib/postgresql/${{ matrix.old_pg }}/test \
            -D /var/lib/postgresql/${{ matrix.new_pg }}/test \
            -o '-c config_file=/etc/postgresql/${{ matrix.old_pg }}/test/postgresql.conf' \
            -O '-c config_file=/etc/postgresql/${{ matrix.new_pg }}/test/postgresql.conf'" postgres \
            || { find /tmp/pg_upgrade_logs \
                      /var/lib/postgresql/${{ matrix.new_pg }}/test/pg_upgrade_output.d \
                      -name '*.log' 2>/dev/null | sort | xargs -r tail -n +1; exit 1; }
          pg_ctlcluster ${{ matrix.new_pg }} test start
      - name: Update the pg_upgraded extension to the current version
        # Exercises ALTER EXTENSION UPDATE on genuinely pg_upgraded objects (the
        # 0.2.2 extension binary pg_upgrade just migrated), running the
        # version-to-version scripts up to the current version. The 0.2.2 -> 0.3.0
        # script uses ALTER TYPE ... ADD VALUE, which is why new_pg must be >= 12.
        run: psql -c "ALTER EXTENSION cat_tools UPDATE"
      - name: Verify extension version after update
        run: |
          INSTALLED=$(psql -tAc "SELECT extversion FROM pg_extension WHERE extname = 'cat_tools'")
          EXPECTED=$(make -s print-PGXNVERSION 2>/dev/null | sed -n 's/.*set to "\(.*\)"$/\1/p')
          echo "installed=$INSTALLED expected=$EXPECTED"
          # Assert the pg_upgraded + updated extension reached the version in META.in.json.
          if [ -z "$INSTALLED" ] || [ -z "$EXPECTED" ] || [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "FAIL: installed='$INSTALLED' expected='$EXPECTED'"; exit 1
          fi
      - name: Run test suite against the pg_upgraded database (existing mode)
        # Run the suite against the REAL pg_upgraded + updated `test` database,
        # not a fresh throwaway one: TEST_LOAD_SOURCE=existing makes load.sql
        # assert (not reinstall) the extension, and --use-existing tells pg_regress
        # to use `test` instead of dropping/recreating it (which would destroy the
        # pg_upgraded objects). This is what actually exercises the migrated
        # objects; a plain `make test` would silently test a fresh install instead.
        run: |
          make test TEST_LOAD_SOURCE=existing CONTRIB_TESTDB=test EXTRA_REGRESS_OPTS=--use-existing
          # See note in the "test" job: make test does not fail on regressions.
          make verify-results

  extension-update-test:
    strategy:
      matrix:
        # PG12+: exercise the WIDEST update path we support — CREATE EXTENSION at
        # the 0.2.2 backward-compat floor, ALTER EXTENSION UPDATE to the CURRENT
        # version, and run the full suite against the updated database. 0.2.2 is
        # the floor because the 0.2.0/0.2.1 install scripts fail on PG11+/PG12+;
        # PG12 is the PostgreSQL floor because the update runs
        # `ALTER TYPE ... ADD VALUE`, which PG11 and below cannot run in an
        # extension update script (lifted in PG12).
        # PG10: the ONLY version where the pre-0.2.2 install scripts still load,
        # so the only place the 0.2.0->0.2.2 and 0.2.1->0.2.2 update scripts can
        # be exercised. They target 0.2.2 (not the current version) and use no
        # ALTER TYPE ... ADD VALUE, so they run on PG10. The PG10 leg runs only
        # those two checks — not the current-version suite (0.3.0 needs PG12+).
        # See the per-step `if` guards.
        pg: [18, 17, 16, 15, 14, 13, 12, 10]
    name: ⬆️ Extension update test on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Install rsync and server headers
        # server-dev provides catalog/pg_class.h for the relkind drift check
        # (see the "test" job); required so check-relkind-source below passes.
        # PG10 runs only the legacy-script checks (no suite), so it needs no headers.
        if: matrix.pg != '10'
        run: apt-get install -y rsync postgresql-server-dev-${{ matrix.pg }}
      - name: Install rsync
        if: matrix.pg == '10'
        run: apt-get install -y rsync
      - name: Install cat_tools (all versions)
        run: make install
      - name: Test update 0.2.0 → 0.2.2 (pre-0.2.2 scripts, PG10 only)
        # 0.2.0/0.2.1 install only on PG10; their update scripts (which target
        # 0.2.2) are otherwise never exercised. PG picks the shortest path, so
        # this uses the direct 0.2.0--0.2.2 script.
        if: matrix.pg == '10'
        run: |
          createdb cat_tools_from_020
          psql -d cat_tools_from_020 -c "CREATE EXTENSION cat_tools VERSION '0.2.0'"
          psql -d cat_tools_from_020 -c "ALTER EXTENSION cat_tools UPDATE TO '0.2.2'"
          INSTALLED=$(psql -d cat_tools_from_020 -tAc "SELECT extversion FROM pg_extension WHERE extname = 'cat_tools'")
          echo "installed=$INSTALLED"
          if [ -z "$INSTALLED" ] || [ "$INSTALLED" != "0.2.2" ]; then
            echo "FAIL: expected 0.2.2, got '$INSTALLED'"; exit 1
          fi
      - name: Test update 0.2.1 → 0.2.2 (pre-0.2.2 script, PG10 only)
        # Start at 0.2.1 so the 0.2.1--0.2.2 script (skipped by the shortest-path
        # 0.2.0->0.2.2 check above) is exercised directly.
        if: matrix.pg == '10'
        run: |
          createdb cat_tools_from_021
          psql -d cat_tools_from_021 -c "CREATE EXTENSION cat_tools VERSION '0.2.1'"
          psql -d cat_tools_from_021 -c "ALTER EXTENSION cat_tools UPDATE TO '0.2.2'"
          INSTALLED=$(psql -d cat_tools_from_021 -tAc "SELECT extversion FROM pg_extension WHERE extname = 'cat_tools'")
          echo "installed=$INSTALLED"
          if [ -z "$INSTALLED" ] || [ "$INSTALLED" != "0.2.2" ]; then
            echo "FAIL: expected 0.2.2, got '$INSTALLED'"; exit 1
          fi
      - name: Test update from 0.2.2 to current
        # Explicit, build-sourced version assertion for the 0.2.2 -> current path
        # (PG12+) — the same path the suite step below runs. EXPECTED comes from
        # the build (META.in.json), and the empty-value guard keeps it from
        # false-passing if either side fails to resolve.
        if: matrix.pg != '10'
        run: |
          createdb cat_tools_from_022
          psql -d cat_tools_from_022 -c "CREATE EXTENSION cat_tools VERSION '0.2.2'"
          psql -d cat_tools_from_022 -c "ALTER EXTENSION cat_tools UPDATE"
          INSTALLED=$(psql -d cat_tools_from_022 -tAc "SELECT extversion FROM pg_extension WHERE extname = 'cat_tools'")
          EXPECTED=$(make -s print-PGXNVERSION 2>/dev/null | sed -n 's/.*set to "\(.*\)"$/\1/p')
          echo "installed=$INSTALLED expected=$EXPECTED"
          if [ -z "$INSTALLED" ] || [ -z "$EXPECTED" ] || [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "FAIL: installed='$INSTALLED' expected='$EXPECTED'"; exit 1
          fi
      - name: Run test suite against the updated (0.2.2 → current) database
        # TEST_LOAD_SOURCE=update makes load.sql install 0.2.2 then ALTER EXTENSION
        # UPDATE to the current version (committed, before the suite) instead of a
        # fresh CREATE EXTENSION. Reusing the SAME suite and expected output asserts
        # the updated database behaves identically to a fresh install. The commit
        # is required because the update uses ALTER TYPE ... ADD VALUE, whose new
        # values cannot be used in the same transaction (see test/install/load.sql).
        if: matrix.pg != '10'
        env:
          TEST_LOAD_SOURCE: update
        run: |
          make check-relkind-source
          make test
          # See note in the "test" job: make test does not fail on regressions.
          make verify-results

  # A single stable check name for use as a required status check in branch
  # protection rules. Matrix jobs produce check names like "🐘 PostgreSQL 14"
  # which would all need to be listed individually and updated whenever the
  # matrix changes. This job passes if all others passed or were skipped (e.g.
  # on a docs-only push with paths-ignore), and fails if any failed or were
  # cancelled.
  all-checks-passed:
    needs: [test, pg-upgrade-test, extension-update-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify all jobs are listed in needs
        # Ensures this job won't silently ignore a newly-added job that was
        # omitted from the needs list above.
        run: |
          DEFINED=$(python3 -c "
          import yaml
          with open('.github/workflows/ci.yml') as f:
              w = yaml.safe_load(f)
          print('\n'.join(sorted(j for j in w['jobs'] if j != 'all-checks-passed')))
          ")
          NEEDED=$(echo '${{ toJson(needs) }}' | python3 -c "
          import json, sys
          print('\n'.join(sorted(json.load(sys.stdin))))
          ")
          if [ "$DEFINED" != "$NEEDED" ]; then
            echo "Some jobs are missing from all-checks-passed needs:"
            diff <(echo "$DEFINED") <(echo "$NEEDED")
            exit 1
          fi
      - name: Check all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
